<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>클래식 윈도우 95 지뢰찾기 (Minesweeper)</title>
  <style>
    /* =========================================================
       1. 디자인 토큰 & 테마
       ========================================================= */
    :root {
      color-scheme: light;
      --win-silver: #c0c0c0;
      --win-white: #ffffff;
      --win-shadow: #808080;
      --win-dark: #000000;
      --win-grid: #7b7b7b;
      --win-title: #000080;
      --desktop-color: #008080;

      --led-on: #ff0000;
      --led-off: #320000;
      --led-background: #000000;

      --cell-size: 24px;
      --cell-font-size: 18px;

      --number-1: #0000ff;
      --number-2: #008000;
      --number-3: #ff0000;
      --number-4: #000080;
      --number-5: #800000;
      --number-6: #008080;
      --number-7: #000000;
      --number-8: #808080;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--desktop-color);
      color: #000;
      font-family: Tahoma, "MS Sans Serif", Arial, sans-serif;
      font-size: 12px;
    }

    button, select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .desktop {
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: 32px 12px;
    }

    /* =========================================================
       2. 윈도우 95 3D 베벨 효과
       ========================================================= */
    .bevel-raised {
      border: 1px solid var(--win-dark);
      background-color: var(--win-silver);
      box-shadow:
        inset 1px 1px 0 var(--win-white),
        inset -1px -1px 0 var(--win-shadow);
    }

    .bevel-inset {
      border: 2px solid;
      border-color:
        var(--win-shadow)
        var(--win-white)
        var(--win-white)
        var(--win-shadow);
    }

    /* 윈도우 프레임 */
    .minesweeper-window {
      width: max-content;
      max-width: 100%;
      padding: 3px;
      background: var(--win-silver);
      border: 1px solid var(--win-dark);
      box-shadow:
        inset 1px 1px 0 var(--win-white),
        inset -1px -1px 0 var(--win-shadow),
        3px 3px 0 rgb(0 0 0 / 25%);
    }

    .title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 24px;
      padding: 3px 5px;
      color: #fff;
      background: var(--win-title);
    }

    .title-bar__title {
      display: flex;
      align-items: center;
      gap: 5px;
      margin: 0;
      font-size: 12px;
      font-weight: 700;
    }

    .title-bar__decoration {
      display: grid;
      place-items: center;
      width: 16px;
      height: 14px;
      color: #000;
      background: var(--win-silver);
      border: 1px solid #000;
      box-shadow:
        inset 1px 1px 0 #fff,
        inset -1px -1px 0 #808080;
      font-size: 10px;
      line-height: 1;
      cursor: default;
    }

    .window-body {
      display: grid;
      gap: 8px;
      padding: 8px;
      min-width: 0;
    }

    /* 난이도 메뉴 */
    .game-menu {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .game-menu label {
      white-space: nowrap;
      font-weight: bold;
    }

    .game-menu select {
      min-height: 24px;
      padding: 2px 6px;
      color: #000;
      background: #fff;
      border: 2px solid;
      border-color:
        var(--win-shadow)
        var(--win-white)
        var(--win-white)
        var(--win-shadow);
      border-radius: 0;
      cursor: pointer;
    }

    /* =========================================================
       3. 상태창 (대시보드)
       ========================================================= */
    .dashboard {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      padding: 6px 10px;
      background: var(--win-silver);
    }

    #mine-counter {
      justify-self: start;
    }

    #timer {
      justify-self: end;
    }

    /* 7세그먼트 LED 카운터 (Pure CSS Gradient) */
    .led-counter {
      display: inline-flex;
      align-items: center;
      gap: 1px;
      padding: 2px 3px;
      margin: 0;
      background: var(--led-background);
      border: 1px solid;
      border-color:
        var(--win-shadow)
        var(--win-white)
        var(--win-white)
        var(--win-shadow);
      direction: ltr;
    }

    .led-digit {
      --a: var(--led-off);
      --b: var(--led-off);
      --c: var(--led-off);
      --d: var(--led-off);
      --e: var(--led-off);
      --f: var(--led-off);
      --g: var(--led-off);

      display: block;
      flex: 0 0 14px;
      width: 14px;
      height: 24px;
      background:
        linear-gradient(var(--a), var(--a)) 3px 1px / 8px 2px,
        linear-gradient(var(--b), var(--b)) 11px 3px / 2px 8px,
        linear-gradient(var(--c), var(--c)) 11px 13px / 2px 8px,
        linear-gradient(var(--d), var(--d)) 3px 21px / 8px 2px,
        linear-gradient(var(--e), var(--e)) 1px 13px / 2px 8px,
        linear-gradient(var(--f), var(--f)) 1px 3px / 2px 8px,
        linear-gradient(var(--g), var(--g)) 3px 11px / 8px 2px;
      background-repeat: no-repeat;
    }

    .led-digit:is([data-value="0"], [data-value="2"], [data-value="3"], [data-value="5"], [data-value="6"], [data-value="7"], [data-value="8"], [data-value="9"]) { --a: var(--led-on); }
    .led-digit:is([data-value="0"], [data-value="1"], [data-value="2"], [data-value="3"], [data-value="4"], [data-value="7"], [data-value="8"], [data-value="9"]) { --b: var(--led-on); }
    .led-digit:is([data-value="0"], [data-value="1"], [data-value="3"], [data-value="4"], [data-value="5"], [data-value="6"], [data-value="7"], [data-value="8"], [data-value="9"]) { --c: var(--led-on); }
    .led-digit:is([data-value="0"], [data-value="2"], [data-value="3"], [data-value="5"], [data-value="6"], [data-value="8"], [data-value="9"]) { --d: var(--led-on); }
    .led-digit:is([data-value="0"], [data-value="2"], [data-value="6"], [data-value="8"]) { --e: var(--led-on); }
    .led-digit:is([data-value="0"], [data-value="4"], [data-value="5"], [data-value="6"], [data-value="8"], [data-value="9"]) { --f: var(--led-on); }
    .led-digit:is([data-value="2"], [data-value="3"], [data-value="4"], [data-value="5"], [data-value="6"], [data-value="8"], [data-value="9"], [data-value="-"]) { --g: var(--led-on); }

    /* 스마일리 리셋 버튼 */
    .face-button {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 0;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .face-button__icon {
      display: block;
      font-size: 18px;
      line-height: 1;
    }

    .face-button__icon::before { content: "😊"; }
    .face-button[data-face="pressing"] .face-button__icon::before { content: "😮"; }
    .face-button[data-face="lost"] .face-button__icon::before { content: "😵"; }
    .face-button[data-face="won"] .face-button__icon::before { content: "😎"; }

    .face-button:active {
      box-shadow:
        inset 1px 1px 0 var(--win-shadow),
        inset -1px -1px 0 var(--win-white);
    }
    .face-button:active .face-button__icon {
      transform: translate(1px, 1px);
    }

    /* =========================================================
       4. 격자 보드 레이아웃 & 셀 스타일
       ========================================================= */
    .board-viewport {
      min-width: 0;
      max-width: 100%;
      overflow: auto;
      overscroll-behavior: contain;
    }

    .board-frame {
      width: max-content;
      padding: 1px;
      background: var(--win-grid);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(var(--columns, 9), var(--cell-size));
      grid-auto-rows: var(--cell-size);
      gap: 0;
      width: max-content;
      background: var(--win-grid);
      user-select: none;
      -webkit-user-select: none;
    }

    .cell {
      position: relative;
      display: grid;
      place-items: center;
      width: var(--cell-size);
      height: var(--cell-size);
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid var(--win-dark);
      border-radius: 0;
      background: var(--win-silver);
      box-shadow:
        inset 2px 2px 0 var(--win-white),
        inset -2px -2px 0 var(--win-shadow);
      color: #000;
      font-family: "Arial Black", Arial, sans-serif;
      font-size: var(--cell-font-size);
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
    }

    .cell__symbol {
      display: block;
      line-height: 1;
      pointer-events: none;
    }

    @media (hover: hover) and (pointer: fine) {
      .cell:is([data-state="closed"], [data-state="questioned"]):not([aria-disabled="true"]):hover {
        background-color: #d6d6d6;
      }
    }

    .cell:is([data-state="closed"], [data-state="questioned"]):not([aria-disabled="true"]):is(:active, [data-pressed="true"]) {
      border: 1px solid var(--win-grid);
      box-shadow: none;
      background: var(--win-silver);
    }

    .cell:is([data-state="revealed"], [data-state="mine"], [data-state="exploded"], [data-state="wrong-flag"]) {
      border: 1px solid var(--win-grid);
      box-shadow: none;
      background: var(--win-silver);
      cursor: default;
    }

    /* 숫자별 고유 색상 */
    .cell[data-state="revealed"][data-number="0"] .cell__symbol::before { content: ""; }
    .cell[data-state="revealed"][data-number="1"] .cell__symbol::before { content: "1"; color: var(--number-1); }
    .cell[data-state="revealed"][data-number="2"] .cell__symbol::before { content: "2"; color: var(--number-2); }
    .cell[data-state="revealed"][data-number="3"] .cell__symbol::before { content: "3"; color: var(--number-3); }
    .cell[data-state="revealed"][data-number="4"] .cell__symbol::before { content: "4"; color: var(--number-4); }
    .cell[data-state="revealed"][data-number="5"] .cell__symbol::before { content: "5"; color: var(--number-5); }
    .cell[data-state="revealed"][data-number="6"] .cell__symbol::before { content: "6"; color: var(--number-6); }
    .cell[data-state="revealed"][data-number="7"] .cell__symbol::before { content: "7"; color: var(--number-7); }
    .cell[data-state="revealed"][data-number="8"] .cell__symbol::before { content: "8"; color: var(--number-8); }

    /* 깃발 / 물음표 / 지뢰 / 폭발 */
    .cell:is([data-state="flagged"], [data-state="mine"], [data-state="exploded"], [data-state="wrong-flag"]) .cell__symbol {
      font-size: 15px;
      font-weight: 400;
    }

    .cell[data-state="flagged"] .cell__symbol::before { content: "🚩"; }
    .cell[data-state="questioned"] .cell__symbol::before { content: "?"; color: #000; font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; }
    .cell:is([data-state="mine"], [data-state="exploded"], [data-state="wrong-flag"]) .cell__symbol::before { content: "💣"; }
    .cell[data-state="exploded"] { background: #ff0000 !important; }

    /* 잘못 꽂은 깃발 */
    .cell[data-state="wrong-flag"]::after {
      content: "×";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #f00;
      font-family: Arial, sans-serif;
      font-size: 26px;
      font-weight: 900;
      line-height: 1;
      pointer-events: none;
    }

    /* 하단 상태 표시줄 */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 22px;
      padding: 3px 5px;
      border: 1px solid;
      border-color:
        var(--win-shadow)
        var(--win-white)
        var(--win-white)
        var(--win-shadow);
      font-size: 11px;
    }

    .status-bar__hint {
      color: #333;
    }
  </style>
</head>

<body>
  <main class="desktop">
    <section id="minesweeper" class="minesweeper-window" aria-labelledby="game-title">
      <!-- 윈도우 타이틀 바 -->
      <header class="title-bar">
        <h1 id="game-title" class="title-bar__title">
          <span>💣</span>
          지뢰찾기 (Minesweeper 95)
        </h1>
        <span class="title-bar__decoration">?</span>
      </header>

      <div class="window-body">
        <!-- 난이도 메뉴 -->
        <nav class="game-menu" aria-label="게임 설정">
          <label for="difficulty">난이도:</label>
          <select id="difficulty" name="difficulty">
            <option value="beginner" selected>초급 (9 × 9, 지뢰 10개)</option>
            <option value="intermediate">중급 (16 × 16, 지뢰 40개)</option>
            <option value="expert">고급 (16 × 30, 지뢰 99개)</option>
          </select>
        </nav>

        <!-- 상단 대시보드 -->
        <div class="dashboard bevel-inset">
          <!-- 남은 지뢰 카운터 -->
          <output id="mine-counter" class="led-counter" aria-label="남은 지뢰">
            <span class="led-digit" data-value="0"></span>
            <span class="led-digit" data-value="1"></span>
            <span class="led-digit" data-value="0"></span>
          </output>

          <!-- 스마일리 리셋 버튼 -->
          <button id="reset-button" class="face-button bevel-raised" type="button" aria-label="게임 재시작" data-face="normal">
            <span class="face-button__icon" aria-hidden="true"></span>
          </button>

          <!-- 타이머 카운터 -->
          <output id="timer" class="led-counter" aria-label="경과 시간">
            <span class="led-digit" data-value="0"></span>
            <span class="led-digit" data-value="0"></span>
            <span class="led-digit" data-value="0"></span>
          </output>
        </div>

        <!-- 게임 보드 뷰포트 -->
        <div class="board-viewport" role="region" aria-label="게임 보드" tabindex="0">
          <div class="board-frame bevel-inset">
            <div id="board" class="board" style="--columns: 9;"></div>
          </div>
        </div>

        <!-- 하단 상태 안내줄 -->
        <footer class="status-bar">
          <span id="game-status" role="status">준비 완료</span>
          <span class="status-bar__hint">좌클릭: 열기 · 우클릭: 깃발/물음표 · 더블클릭: 주변열기</span>
        </footer>
      </div>
    </section>
  </main>

  <script>
    /* =========================================================
       1. 지뢰찾기 코어 엔진 (Step 1 수집본)
       ========================================================= */
    const MINESWEEPER_PRESETS = Object.freeze({
      beginner: Object.freeze({ rows: 9, cols: 9, mines: 10 }),
      intermediate: Object.freeze({ rows: 16, cols: 16, mines: 40 }),
      expert: Object.freeze({ rows: 16, cols: 30, mines: 99 })
    });

    class MinesweeperEngine {
      static get PRESETS() {
        return MINESWEEPER_PRESETS;
      }

      constructor(difficulty = "beginner") {
        this.reset(difficulty);
      }

      get remainingMines() {
        return this.mines - this.flagsPlaced;
      }

      get elapsedTime() {
        if (this.status === "PLAYING" && this.startTime) {
          return Math.floor(Math.max(0, Date.now() - this.startTime) / 1000);
        }
        return Math.floor(this._elapsedMs / 1000);
      }

      reset(difficulty = this.difficulty) {
        const preset = this._getPreset(difficulty);
        this.difficulty = difficulty;
        this.rows = preset.rows;
        this.cols = preset.cols;
        this.mines = preset.mines;

        this.status = "READY";
        this.flagsPlaced = 0;
        this.revealedCount = 0;
        this.startTime = null;
        this._elapsedMs = 0;
        this.explodedCell = null;

        this.board = Array.from({ length: this.rows }, (_, r) =>
          Array.from({ length: this.cols }, (_, c) => ({
            r,
            c,
            isMine: false,
            isRevealed: false,
            isFlagged: false,
            isQuestion: false,
            neighborMines: 0
          }))
        );

        return this;
      }

      start(difficulty, firstClickR, firstClickC) {
        this.reset(difficulty);
        return this.revealCell(firstClickR, firstClickC);
      }

      revealCell(r, c) {
        this._assertPosition(r, c);
        if (this._isFinished()) return [];

        const cell = this.board[r][c];
        if (cell.isRevealed || cell.isFlagged) return [];

        if (this.status === "READY") {
          this._begin(r, c);
        }

        return this._revealTargets([cell]);
      }

      toggleFlag(r, c) {
        this._assertPosition(r, c);
        if (this._isFinished()) return [];

        const cell = this.board[r][c];
        if (cell.isRevealed) return [];

        if (cell.isFlagged) {
          cell.isFlagged = false;
          cell.isQuestion = true;
          this.flagsPlaced -= 1;
        } else if (cell.isQuestion) {
          cell.isQuestion = false;
        } else {
          cell.isFlagged = true;
          this.flagsPlaced += 1;
        }

        return [cell];
      }

      chord(r, c) {
        this._assertPosition(r, c);
        if (this.status !== "PLAYING") return [];

        const cell = this.board[r][c];
        if (!cell.isRevealed || cell.isMine || cell.neighborMines === 0) return [];

        const neighbors = Array.from(this._neighbors(r, c));
        const flagCount = neighbors.reduce((cnt, n) => cnt + (n.isFlagged ? 1 : 0), 0);

        if (flagCount !== cell.neighborMines) return [];

        const targets = neighbors.filter(n => !n.isRevealed && !n.isFlagged);
        return this._revealTargets(targets);
      }

      checkWinCondition() {
        if (this.status === "WON") return true;
        if (this.status !== "PLAYING") return false;

        const safeCellCount = this.rows * this.cols - this.mines;
        if (this.revealedCount === safeCellCount) {
          this._finish("WON");
          return true;
        }
        return false;
      }

      _getPreset(diff) {
        if (!MINESWEEPER_PRESETS[diff]) {
          throw new RangeError(`지원하지 않는 난이도: ${diff}`);
        }
        return MINESWEEPER_PRESETS[diff];
      }

      _assertPosition(r, c) {
        if (r < 0 || r >= this.rows || c < 0 || c >= this.cols) {
          throw new RangeError(`유효하지 않은 좌표: (${r}, ${c})`);
        }
      }

      _isFinished() {
        return this.status === "WON" || this.status === "LOST";
      }

      *_neighbors(r, c) {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = r + dr;
            const nc = c + dc;
            if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols) {
              yield this.board[nr][nc];
            }
          }
        }
      }

      _begin(firstR, firstC) {
        const candidates = [];
        for (const row of this.board) {
          for (const cell of row) {
            const isSafe = Math.abs(cell.r - firstR) <= 1 && Math.abs(cell.c - firstC) <= 1;
            if (!isSafe) candidates.push(cell);
          }
        }

        // Fisher-Yates 셔플
        for (let i = 0; i < this.mines; i++) {
          const j = i + Math.floor(Math.random() * (candidates.length - i));
          [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
          candidates[i].isMine = true;
        }

        for (let i = 0; i < this.mines; i++) {
          const m = candidates[i];
          for (const neighbor of this._neighbors(m.r, m.c)) {
            neighbor.neighborMines++;
          }
        }

        this.startTime = Date.now();
        this.status = "PLAYING";
      }

      _revealTargets(targets) {
        const changedCells = [];
        const stack = targets.slice();

        while (stack.length > 0) {
          const cell = stack.pop();
          if (cell.isRevealed || cell.isFlagged) continue;

          if (cell.isMine) {
            this._lose(cell, changedCells);
            return changedCells;
          }

          cell.isRevealed = true;
          cell.isQuestion = false;
          this.revealedCount++;
          changedCells.push(cell);

          if (cell.neighborMines === 0) {
            for (const neighbor of this._neighbors(cell.r, cell.c)) {
              if (!neighbor.isRevealed && !neighbor.isFlagged) {
                stack.push(neighbor);
              }
            }
          }
        }

        this.checkWinCondition();
        return changedCells;
      }

      _lose(explodedCell, changedCells) {
        this.explodedCell = explodedCell;
        for (const row of this.board) {
          for (const cell of row) {
            if (cell.isMine && !cell.isRevealed) {
              cell.isRevealed = true;
              cell.isQuestion = false;
              changedCells.push(cell);
            }
          }
        }
        this._finish("LOST");
      }

      _finish(status) {
        if (this.status !== "PLAYING") return;
        this._elapsedMs = Math.max(0, Date.now() - this.startTime);
        this.status = status;
      }
    }

    /* =========================================================
       2. UI 및 이벤트 컨트롤러 (DOM Connector)
       ========================================================= */
    const boardEl = document.getElementById("board");
    const diffSelect = document.getElementById("difficulty");
    const resetBtn = document.getElementById("reset-button");
    const mineCounterEl = document.getElementById("mine-counter");
    const timerEl = document.getElementById("timer");
    const statusTextEl = document.getElementById("game-status");

    let engine = new MinesweeperEngine(diffSelect.value);
    let timerInterval = null;

    function format3Digits(num) {
      if (num < 0) {
        const absStr = String(Math.min(99, Math.abs(num))).padStart(2, "0");
        return ["-", absStr[0], absStr[1]];
      }
      const str = String(Math.min(999, Math.max(0, num))).padStart(3, "0");
      return [str[0], str[1], str[2]];
    }

    function updateLEDDisplay(container, digits) {
      const spans = container.querySelectorAll(".led-digit");
      spans.forEach((span, idx) => {
        span.setAttribute("data-value", digits[idx]);
      });
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (engine.status === "PLAYING") {
          updateLEDDisplay(timerEl, format3Digits(engine.elapsedTime));
        } else {
          clearInterval(timerInterval);
        }
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function renderCell(cell, btn) {
      if (engine.status === "LOST" && cell.isMine) {
        if (engine.explodedCell && cell.r === engine.explodedCell.r && cell.c === engine.explodedCell.c) {
          btn.setAttribute("data-state", "exploded");
        } else {
          btn.setAttribute("data-state", "mine");
        }
        return;
      }

      if (engine.status === "LOST" && cell.isFlagged && !cell.isMine) {
        btn.setAttribute("data-state", "wrong-flag");
        return;
      }

      if (cell.isRevealed) {
        btn.setAttribute("data-state", "revealed");
        btn.setAttribute("data-number", cell.neighborMines);
      } else if (cell.isFlagged) {
        btn.setAttribute("data-state", "flagged");
      } else if (cell.isQuestion) {
        btn.setAttribute("data-state", "questioned");
      } else {
        btn.setAttribute("data-state", "closed");
        btn.removeAttribute("data-number");
      }
    }

    function updateAllCells() {
      const buttons = boardEl.querySelectorAll(".cell");
      buttons.forEach(btn => {
        const r = parseInt(btn.getAttribute("data-row"), 10);
        const c = parseInt(btn.getAttribute("data-col"), 10);
        renderCell(engine.board[r][c], btn);
      });
    }

    function updateGameStatus() {
      updateLEDDisplay(mineCounterEl, format3Digits(engine.remainingMines));
      updateLEDDisplay(timerEl, format3Digits(engine.elapsedTime));

      if (engine.status === "READY") {
        resetBtn.setAttribute("data-face", "normal");
        statusTextEl.textContent = "준비 완료 (첫 클릭 안전 보장)";
      } else if (engine.status === "PLAYING") {
        resetBtn.setAttribute("data-face", "normal");
        statusTextEl.textContent = "지뢰 탐색 중...";
      } else if (engine.status === "WON") {
        resetBtn.setAttribute("data-face", "won");
        statusTextEl.textContent = "🎉 축하합니다! 모든 지뢰를 찾았습니다!";
        stopTimer();
      } else if (engine.status === "LOST") {
        resetBtn.setAttribute("data-face", "lost");
        statusTextEl.textContent = "💣 지뢰를 밟았습니다! 게임 오버";
        stopTimer();
      }
    }

    function initBoard() {
      stopTimer();
      engine.reset(diffSelect.value);
      boardEl.style.setProperty("--columns", engine.cols);
      boardEl.innerHTML = "";

      for (let r = 0; r < engine.rows; r++) {
        for (let c = 0; c < engine.cols; c++) {
          const btn = document.createElement("button");
          btn.className = "cell";
          btn.type = "button";
          btn.setAttribute("data-row", r);
          btn.setAttribute("data-col", c);
          btn.setAttribute("data-state", "closed");

          const symbolSpan = document.createElement("span");
          symbolSpan.className = "cell__symbol";
          symbolSpan.setAttribute("aria-hidden", "true");
          btn.appendChild(symbolSpan);

          // 마우스 누를 때 스마일리 '😮' 효과
          btn.addEventListener("mousedown", (e) => {
            if (e.button === 0 && engine.status !== "WON" && engine.status !== "LOST") {
              resetBtn.setAttribute("data-face", "pressing");
            }
          });

          // 좌클릭: 열기
          btn.addEventListener("click", () => {
            if (engine.status === "READY") {
              startTimer();
            }
            engine.revealCell(r, c);
            updateAllCells();
            updateGameStatus();
          });

          // 우클릭: 깃발 토글
          btn.addEventListener("contextmenu", (e) => {
            e.preventDefault();
            engine.toggleFlag(r, c);
            updateAllCells();
            updateGameStatus();
          });

          // 더블클릭: Chord
          btn.addEventListener("dblclick", () => {
            engine.chord(r, c);
            updateAllCells();
            updateGameStatus();
          });

          boardEl.appendChild(btn);
        }
      }

      window.addEventListener("mouseup", () => {
        if (engine.status === "READY" || engine.status === "PLAYING") {
          resetBtn.setAttribute("data-face", "normal");
        }
      });

      updateGameStatus();
    }

    // 컨트롤 이벤트 바인딩
    resetBtn.addEventListener("click", () => initBoard());
    diffSelect.addEventListener("change", () => initBoard());

    // 초기 시작
    initBoard();
  </script>
</body>
</html>
